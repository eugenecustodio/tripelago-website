<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My account · Tripelago</title>
    <base href="../">
    <meta name="description" content="Your Tripelago bookings, payment status and saved trips.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f4f8f9">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Tripelago">
    <meta property="og:title" content="My account · Tripelago">
    <meta property="og:description" content="Your Tripelago bookings, payment status and saved trips.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1697473259118-473211915531?auto=format&amp;fit=crop&amp;w=1200&amp;h=630&amp;q=80">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="assets/img/brand/brand-favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <a class="skip-link" href="pages/account.html#main">Skip to main content</a>
    <header>
        <a class="header-brand" href="index.html" aria-label="Tripelago, home">
            <img src="assets/img/brand/logo-mark.png" alt="" width="96" height="96">
            <span class="header-brand-name" aria-hidden="true">Tripelago</span>
        </a>
        <nav id="site-nav" aria-label="Main">
            <a href="index.html">Home</a>
            <a href="pages/destinations.html">Destinations</a>
            <a href="pages/plans.html">Plans</a>
            <a href="pages/about.html">About us</a>
        </nav>
        <div class="header-actions">
            <a class="header-cart" href="pages/cart.html" aria-label="Cart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 7h12l-1 12.2a2 2 0 0 1-2 1.8H9a2 2 0 0 1-2-1.8z"></path><path d="M9 9V6a3 3 0 0 1 6 0v3"></path></svg><span class="header-cart-count" aria-hidden="true">0</span></a>
            <a class="header-cta" href="pages/sign-in.html" data-auth-cta>Sign in</a>
            <button class="header-menu" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 8h16M4 16h16"></path></svg></button>
        </div>
    </header>
    <noscript><p class="noscript">Booking, the cart and accounts need JavaScript. Please turn it on to book a trip.</p></noscript>

    <main id="main" tabindex="-1">
        <section class="page">
            <div class="page-head">
                <h1>My account</h1>
                <p>Your bookings and saved trips.</p>
            </div>
            <div class="account-layout">
                <aside class="card profile" aria-label="Profile">
                    <span class="avatar" id="acct-initial" aria-hidden="true"></span>
                    <h2 id="acct-name"></h2>
                    <p id="acct-email"></p>
                    <p id="acct-since"></p>
                    <div class="profile-links">
                        <a href="pages/account.html#bookings-title">Bookings</a>
                        <a href="pages/account.html#saved-title">Saved trips</a>
                        <a href="pages/contact.html?topic=booking">Get help</a>
                    </div>
                    <button class="btn ghost small" type="button" id="logout">Sign out</button>
                </aside>
                <div class="account-main">
                    <section aria-labelledby="bookings-title">
                        <div class="section-head">
                            <div><h2 id="bookings-title">Booking history</h2><p id="booking-count"></p></div>
                            <a class="section-link" href="pages/destinations.html">Book a new trip</a>
                        </div>
                        <div id="bookings"></div>
                    </section>
                    <section aria-labelledby="saved-title" class="saved-section">
                        <div class="section-head">
                            <div><h2 id="saved-title">Saved trips</h2><p id="saved-count"></p></div>
                            <a class="section-link" href="pages/destinations.html?view=saved">Open in destinations</a>
                        </div>
                        <div class="saved-grid" id="saved-grid"></div>
                    </section>
                </div>
            </div>
        </section>
    </main>
    <footer class="site-footer slim">
        <div class="footer-bottom">
            <span>© <span data-year>2026</span> Tripelago</span>
            <span class="footer-links"><a href="pages/contact.html">Contact us</a><a href="pages/faq.html">Help</a><a href="pages/terms.html">Terms</a><a href="pages/terms.html#privacy">Privacy</a></span>
        </div>
    </footer>
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/site.js" defer></script>
    <script src="assets/js/pages/account.js" defer></script>
</body>
</html>
